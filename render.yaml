# Render Blueprint: one Docker web service serving the API and the built frontend at one HTTPS URL.
services:
  - type: web
    name: earnscore
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false          # set to the service URL, e.g. https://earnscore.onrender.com
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_OFFICER_EMAIL
        sync: false
      - key: SEED_OFFICER_PASSWORD
        sync: false
      - key: SEED_WORKER_EMAIL
        sync: false
      - key: SEED_WORKER_PASSWORD
        sync: false
